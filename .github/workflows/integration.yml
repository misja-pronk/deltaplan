name: integration

# The integration suite talks to a real workspace: it creates an ephemeral
# schema, runs against it, and drops it again. It runs nightly (and on demand)
# rather than per-PR, because it needs credentials and a warm SQL warehouse.
#
# Setup: add the repository secrets DATABRICKS_HOST, DATABRICKS_TOKEN,
# DATABRICKS_WAREHOUSE_ID and DELTAPLAN_TEST_CATALOG. Without them the job
# skips instead of failing, so forks stay green.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch:

jobs:
  integration:
    name: integration (live workspace)
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
      DELTAPLAN_TEST_CATALOG: ${{ secrets.DELTAPLAN_TEST_CATALOG }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - id: creds
        name: Credentials configured?
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ]; then
            echo "No workspace credentials — skipping the integration suite."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Tests (pytest -m integration)
        if: steps.creds.outputs.present == 'true'
        run: uv run pytest -m integration
