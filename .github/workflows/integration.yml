name: integration

# The live suite: every assumption deltaplan makes about Databricks, checked
# against a real workspace. Each test creates a throwaway schema and drops it.
# It runs on every pull request, nightly (Databricks changes too), and on demand.
# It takes about 40 minutes and isn't a required check — read it before merging
# anything that changes what deltaplan sends to Databricks.
#
# Credentials live in the `databricks-test` environment (Settings → Environments):
# the secrets DATABRICKS_HOST, DATABRICKS_TOKEN, DATABRICKS_WAREHOUSE_ID and
# DELTAPLAN_TEST_CATALOG. A pull request from a fork gets none of them, so there
# the suite skips rather than fails.

on:
  pull_request:
    paths-ignore: ["docs/**", "**.md", "mkdocs.yml"]
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch:
    inputs:
      k:
        description: "Run only the live tests matching this pytest -k expression"
        required: false
        default: ""

concurrency:
  # One suite at a time, across every pull request and the nightly run: the
  # workspace allows a single active DBSQL pipeline, so two suites racing means
  # the materialized-view test fails on the other one's pipeline. A second run
  # waits instead, and a third replaces the one that is waiting.
  group: integration
  cancel-in-progress: false

jobs:
  integration:
    name: integration (live workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: databricks-test
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
      DELTAPLAN_TEST_CATALOG: ${{ secrets.DELTAPLAN_TEST_CATALOG }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # The bundle tests ask the real CLI what a bundle resolves to.
      - uses: databricks/setup-cli@v1.17.0
      - id: creds
        name: Credentials configured?
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ]; then
            echo "No workspace credentials — skipping the integration suite."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Tests (pytest -m integration)
        if: steps.creds.outputs.present == 'true'
        # -k comes from the dispatch form, so it goes through the environment
        # and stays quoted: never interpolated into the script itself.
        env:
          ONLY: ${{ inputs.k }}
        run: |
          if [ -n "$ONLY" ]; then
            uv run pytest -m integration -rA -k "$ONLY"
          else
            uv run pytest -m integration -rA
          fi
