name: integration

# The live suite: every assumption deltaplan makes about Databricks, checked
# against a real workspace. Each test creates a throwaway schema and drops it.
# It runs on every pull request, nightly (Databricks changes too), and on demand.
# It takes about 40 minutes and isn't a required check — read it before merging
# anything that changes what deltaplan sends to Databricks.
#
# Credentials live in the `databricks-test` environment (Settings → Environments):
# the secrets DATABRICKS_HOST, DATABRICKS_TOKEN, DATABRICKS_WAREHOUSE_ID and
# DELTAPLAN_TEST_CATALOG. A pull request from a fork gets none of them, so there
# the suite skips rather than fails.

on:
  pull_request:
    paths-ignore: ["docs/**", "**.md", "mkdocs.yml"]
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch:

concurrency:
  # A new push to a pull request makes its running suite moot.
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: integration (live workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: databricks-test
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
      DELTAPLAN_TEST_CATALOG: ${{ secrets.DELTAPLAN_TEST_CATALOG }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - id: creds
        name: Credentials configured?
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ]; then
            echo "No workspace credentials — skipping the integration suite."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Tests (pytest -m integration)
        if: steps.creds.outputs.present == 'true'
        run: uv run pytest -m integration -rA
