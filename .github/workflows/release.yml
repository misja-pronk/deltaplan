name: release

# A release is a tag. Bump `version` in pyproject.toml (and move the CHANGELOG's
# [Unreleased] notes under it) in a pull request; once it is merged, tag that
# commit and push the tag:
#
#   git tag v0.1.0a7 && git push origin v0.1.0a7
#
# This workflow checks the tag matches the version and sits on main, runs the
# gate on that commit, publishes to PyPI with Trusted Publishing (repository
# misja-pronk/deltaplan, workflow release.yml, environment pypi — no token), and
# creates the GitHub release with the CHANGELOG's notes. The Action's `v0` tag
# then moves to the release, so `uses: misja-pronk/deltaplan@v0` follows it.

on:
  push:
    tags: ["v*.*.*"] # not `v0`, which this workflow moves itself

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to tell whether the tagged commit is on main
      - id: read
        name: The tag must match the version, on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG doesn't match pyproject.toml's version $version — tag v$version, or bump the version first"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG isn't on main — tag a commit that was merged"
            exit 1
          fi
          if curl -fsS -o /dev/null "https://pypi.org/pypi/deltaplan/$version/json"; then
            echo "::error::deltaplan $version is already on PyPI"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  gate:
    name: gate
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest tests/unit

  release:
    name: publish v${{ needs.check.outputs.version }}
    needs: [check, gate]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write # the GitHub release, and moving `v0`
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build
        run: uv build
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
      - name: Release notes from CHANGELOG
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { f=1; next }
            f && index($0, "## [") == 1 { exit }
            f { print }
          ' CHANGELOG.md > notes.md || true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          args=(--title "$TAG" --verify-tag)
          if [ -s notes.md ]; then args+=(--notes-file notes.md); else args+=(--generate-notes); fi
          # 0.1.0a1, 0.2.0rc1 … are PEP 440 pre-releases: say so on GitHub too.
          if [[ "$VERSION" =~ (a|b|rc)[0-9]+$ ]]; then args+=(--prerelease); fi
          gh release create "$TAG" dist/* "${args[@]}"
      - name: Move the major-version tag the GitHub Action is used by
        # `uses: misja-pronk/deltaplan@v0` follows the newest 0.x release. While
        # every release is an alpha, that is the newest alpha.
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          major="v${VERSION%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
