name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type check (ty)
        run: uv run ty check

  test:
    name: test (py${{ matrix.python-version }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # unit tests only — the integration suite needs a live workspace and runs
      # nightly (see integration.yml)
      - name: Tests (pytest)
        run: uv run --python ${{ matrix.python-version }} pytest tests/unit

  actionlint:
    name: workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The installer from actionlint's own README; it fetches a release binary.
      # https://github.com/rhysd/actionlint/blob/main/docs/install.md
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Lint workflows
        run: ./actionlint -color

  docs:
    name: docs (strict build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # mkdocs lives in the `docs` dependency group, which a plain sync skips
      - run: uv sync --group docs
      - name: Build the docs site (strict — broken links/nav fail)
        run: uv run --group docs mkdocs build --strict

  build:
    name: build (wheel + sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Smoke-test the built wheel on 3.11
        run: |
          uv venv /tmp/smoke -p 3.11
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/deltaplan version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
